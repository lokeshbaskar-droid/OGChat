<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OGChat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app" class="app-container">
    
    <!-- ═══ Sidebar ═══ -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-inner">
        
        <!-- Sidebar Header (New Chat & Toggle) -->
        <div class="sidebar-header">
          <button id="sidebarToggleClose" class="icon-btn tooltip-trigger" aria-label="Close sidebar">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
          </button>
          <button id="newChatBtn" class="icon-btn tooltip-trigger" aria-label="New chat">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          </button>
        </div>

        <!-- Sidebar Content (Scrollable) -->
        <div class="sidebar-content">
          <!-- Search -->
          <div class="sidebar-search-container">
             <div class="search-box">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" id="searchInput" placeholder="Search chats..." autocomplete="off">
             </div>
          </div>
          
          <div id="chatList" class="chat-list">
            <!-- Dynamically populated -->
          </div>
        </div>

        <!-- Sidebar Footer -->
        <div class="sidebar-footer">
          <button id="settingsBtn" class="sidebar-menu-item">
            <div class="menu-item-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </div>
            <span class="menu-item-text">Settings</span>
          </button>
          
          <!-- User Profile Area (Mock) -->
          <div class="user-profile-menu">
             <div class="user-avatar">U</div>
             <span class="user-name">Local User</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- ═══ Main Content ═══ -->
    <main class="main-content">
      
      <!-- Top Bar (Fixed) -->
      <header class="top-bar">
        <div class="top-bar-left">
          <button id="sidebarToggleOpen" class="icon-btn tooltip-trigger hidden-desktop" aria-label="Open sidebar">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          
          <div class="model-selector-container">
            <button id="modelSelectorBtn" class="model-dropdown-btn">
              <span class="model-dropdown-label">OGChat</span>
              <span id="modelName" class="model-dropdown-value">gpt-oss:20b</span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </button>
            
            <div id="modelDropdownMenu" class="dropdown-menu hidden">
              <!-- Dynamically populated -->
            </div>
          </div>
        </div>

        <div class="top-bar-right">
           <div id="ollamaStatus" class="status-indicator">
              <span class="status-dot"></span>
              <span class="status-text">Checking...</span>
           </div>
        </div>
      </header>

      <!-- Scrollable Chat Area -->
      <div id="messagesContainer" class="messages-scroll-area">
        <div class="messages-wrapper">
          
          <!-- Welcome Screen (Empty State) -->
          <div id="welcomeScreen" class="welcome-screen">
            <div class="welcome-logo">
               <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
            </div>
            <h2>How can I help you today?</h2>
          </div>

          <!-- Messages List -->
          <div id="messagesArea" class="messages-area hidden">
             <!-- Populated dynamically -->
          </div>

        </div>
      </div>

      <!-- Composer Area (Fixed Bottom) -->
      <div class="composer-container">
        <div class="composer-wrapper">
          <!-- File Previews -->
          <div id="attachedFiles" class="attached-files hidden">
            <!-- Files go here -->
          </div>

          <div class="composer-input-box">
            <button id="attachBtn" class="composer-btn" aria-label="Attach file">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
            </button>
            <input type="file" id="fileInput" multiple style="display: none;" accept=".txt,.md,.json,.csv,.py,.js,.ts,.html,.css,.svg,.xml,.pdf,.docx,.png,.jpg,.jpeg,.gif,.webp,.bmp">
            
            <textarea id="messageInput" class="composer-textarea" rows="1" placeholder="Message OGChat..." autofocus></textarea>
            
            <button id="sendBtn" class="composer-send-btn" disabled aria-label="Send message">
              <svg id="sendIcon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
              <svg id="stopIcon" class="hidden" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
            </button>
          </div>
        </div>
        <div class="composer-footer">
          OGChat can make mistakes. Check important info.
        </div>
      </div>

    </main>
  </div>

  <!-- Connection Overlay -->
  <div id="connectionOverlay" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="connectionTitle">Ollama Not Running</h3>
      </div>
      <div class="modal-body">
        <p id="connectionMessage">Cannot connect to Ollama at localhost:11434</p>
        <p id="connectionError" class="error-text hidden"></p>
      </div>
      <div id="connectionActions" class="modal-footer">
        <button id="startOllamaBtn" class="btn btn-primary">Start Ollama</button>
        <button id="retryConnectionBtn" class="btn btn-secondary">Retry</button>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settingsPanel" class="modal-overlay hidden">
    <div class="modal-card settings-card">
      <div class="modal-header">
        <h3>Settings</h3>
        <button id="closeSettings" class="icon-btn" aria-label="Close settings">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body settings-body">
        <div class="settings-section">
          <h4>General</h4>
          <div class="setting-row">
            <label>Theme</label>
            <select id="themeSelect" class="form-select">
              <option value="system">System</option>
              <option value="dark">Dark</option>
              <option value="light">Light</option>
            </select>
          </div>
        </div>
        <div class="settings-section">
          <h4>Response</h4>
          <div class="setting-row"><label for="temperatureRange">Temperature <span id="temperatureValue">0.7</span></label><input id="temperatureRange" class="form-input" type="range" min="0" max="2" step="0.1" value="0.7"></div>
          <div class="setting-row"><label for="numPredictInput">Maximum response tokens</label><input id="numPredictInput" class="form-input" type="number" min="64" max="8192" step="64" value="2048"></div>
          <div class="setting-row"><button id="clearChatBtn" class="btn btn-secondary">Clear current chat</button></div>
        </div>
        <div class="settings-section">
          <h4>Backend</h4>
          <div class="setting-row">
            <label>Ollama API URL</label>
            <input type="text" class="form-input" value="http://localhost:11434" disabled>
          </div>
          <div class="setting-row">
            <label>Executable Path</label>
            <input type="text" class="form-input" value="D:\Ollama\ollama.exe" disabled>
          </div>
        </div>
        <div class="settings-section">
          <h4>Tools</h4>
          <div id="toolsList" class="tools-list">
             <!-- Populated dynamically -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
